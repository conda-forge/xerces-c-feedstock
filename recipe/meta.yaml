{% set version = "3.3.0" %}

package:
  name: xerces-c
  version: {{ version }}

source:
  url: https://archive.apache.org/dist/xerces/c/3/sources/xerces-c-{{ version }}.tar.gz
  sha256: 9555f1d06f82987fbb4658862705515740414fd34b4db6ad2ed76a2dc08d3bde

build:
  number: 2
  run_exports:
    # changes SO names at minor rev
    - {{ pin_subpackage('xerces-c', max_pin='x.x') }}

requirements:
  build:
    - perl  # [not win]
    - gnuconfig  # [unix]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake  # [win]
    - make  # [not win]
    - autoconf  # [build_platform != target_platform]
    - automake  # [build_platform != target_platform]
    - libtool  # [build_platform != target_platform]
  host:
    - icu       # [not win]
    - libnsl  # [linux]
  run:
    - icu       # [not win]
    - libnsl  # [linux]

test:
  requires:
    - cmake  # [target_platform == "win-arm64"]
    - {{ compiler('cxx') }}  # [target_platform == "win-arm64"]
  files:
    - CMakeLists.txt  # [target_platform == "win-arm64"]
    - test.cpp  # [target_platform == "win-arm64"]
  commands:
    - cmake -S . -B test-build -G "NMake Makefiles"  # [target_platform == "win-arm64"]
    - if errorlevel 1 exit 1  # [target_platform == "win-arm64"]
    - cmake --build test-build --config Release  # [target_platform == "win-arm64"]
    - if errorlevel 1 exit 1  # [target_platform == "win-arm64"]
    - test-build\xerces_consumer.exe  # [target_platform == "win-arm64"]
    - if errorlevel 1 exit 1  # [target_platform == "win-arm64"]
    - dumpbin /headers test-build\xerces_consumer.exe | findstr /I /C:"AA64 machine (ARM64)"  # [target_platform == "win-arm64"]
    - if errorlevel 1 exit 1  # [target_platform == "win-arm64"]
    - dumpbin /headers "%LIBRARY_BIN%\\xerces-c_3_3.dll" | findstr /I /C:"AA64 machine (ARM64)"  # [target_platform == "win-arm64"]
    - if errorlevel 1 exit 1  # [target_platform == "win-arm64"]

about:
  home: http://xerces.apache.org/xerces-c/
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Xerces-C++ is a validating XML parser written in a portable subset of C++

extra:
  recipe-maintainers:
    - gillins
    - groutr
    - ocefpaf
